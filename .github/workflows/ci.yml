# Askaway CI: the two suites that CONTRIBUTING.md names, on every push and pull request.
# Not run on GitHub yet: the first push is the first real run of both jobs.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python suite (CLI and hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Run the Python suite
        working-directory: plugins/askaway/scripts
        run: python3 -m pytest tests -q

  mod:
    name: Mod suite (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # CONTRIBUTING.md does not say how Claude Code is installed, so CI installs the npm package
      # @anthropic-ai/claude-code at 2.1.296, the version the suite was last run with locally.
      # `claude plugin test` needs that CLI on PATH; this step is unverified until the first run.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Run the mod suite
        run: claude plugin test plugins/askaway
